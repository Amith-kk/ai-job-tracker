server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router — all routes serve index.html
    # Without this, refreshing /dashboard gives 404
    # Because nginx looks for a physical /dashboard file
    # which doesn't exist — React Router handles it client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    # /api/anything → backend:5000/api/anything
    # "backend" = service name in docker-compose
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets for 1 year
    # JS/CSS files have hashed names — safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}